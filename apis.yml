aid: moov-io
url: https://raw.githubusercontent.com/api-evangelist/moov-io/refs/heads/main/apis.yml
name: Moov
kind: company
description: Moov is a money-movement platform that lets software teams accept, store,
  send, and spend money through a single REST API. The Moov API covers accounts and
  onboarding, representatives, capabilities and underwriting, funding sources (bank
  accounts, cards, Apple Pay, Google Pay, wallets), and money movement across ACH,
  RTP, push-to-card, and card acquiring - plus transfers, refunds, disputes, sweeps,
  and card issuing. Moov also maintains a well-known open-source GitHub organization
  (github.com/moov-io) of Go libraries for banking file formats (ACH, wire, IAT, and
  more); this catalog documents the commercial hosted Moov money-movement API at
  api.moov.io.
accessModel:
  pricing: paid
  onboarding: self-serve
  trial: false
  try_now: false
  public: false
  label: Paid · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/moov-io.png
tags:
- Payments
- Money Movement
- Fintech
- ACH
- RTP
- Cards
- Wallets
- Embedded Finance
