  endpointsModeledNote: |
    Underwriting endpoints are represented in the OpenAPI on the modeled
    (unconfirmed exact-path) basis - underwriting is a documented Moov Accounts
    resource but its exact HTTP verbs/paths were not confirmed from a public
    reference page during this review. Scheduling is a documented Money Movement
    resource but was likewise left out of the confirmed endpoint list pending a
    reference page. All other endpoints above were confirmed against Moov's
    public API reference at docs.moov.io/api.
