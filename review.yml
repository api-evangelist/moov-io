aid: moov-io
name: Moov
review:
  question: Does Moov expose a documented public WebSocket API?
  answer: false
  date: '2026-07-02'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Moov's public API surface (api.moov.io)
    is request/response REST over HTTPS. Moov delivers asynchronous event
    notifications (transfer status changes, account/capability updates, dispute
    events, etc.) via webhooks - server-to-endpoint HTTPS POST callbacks with an
    HMAC SHA-512 signature - not via a WebSocket or SSE stream on Moov's own API.
    Webhooks are a one-directional callback into the customer's own endpoint and
    there is no documented client-facing streaming transport on api.moov.io to
    model, so no AsyncAPI spec was created.
findings:
  summary: |
    Moov does not publish a documented public WebSocket API. The Moov platform
    exposes a single REST API at https://api.moov.io that is based on REST
    principles, returns JSON, and uses standard HTTP response codes.
    Authentication is via OAuth 2.0 access tokens (Bearer). Asynchronous state
    changes are communicated through webhooks: the customer registers an HTTPS
    endpoint and Moov POSTs signed event payloads to it (HMAC SHA-512
    signature), treating a delivery as failed if it does not receive a 2xx
    within 5 seconds and retrying for up to 24 hours. There is no realtime,
    bidirectional, or streaming WebSocket (ws:// or wss://) or Server-Sent
    Events endpoint documented anywhere on Moov's own API as of the review date.
  openSource: |
    Moov maintains a well-known open-source GitHub organization at
    github.com/moov-io containing Go libraries and Dockerized HTTP servers for
    banking and payments file formats - notably ACH (github.com/moov-io/ach),
    wire, IAT, and related standards. These are self-hostable OSS tools with
    their own OpenAPI specs (e.g. moov-io/ach/openapi.yaml) and are distinct
    from the commercial hosted money-movement API at api.moov.io that this
    catalog documents. The commercial platform SDKs live under the
    github.com/moovfinancial organization and are generated from Moov's
    OpenAPI spec.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.moov.io
      documented: true
      note: The entire Moov money-movement API - accounts, sources, transfers, disputes, issuing - is request/response REST over HTTPS.
    - protocol: Webhook
      scheme: https
      documented: true
      note: Event notifications are delivered as HTTPS POST callbacks to a customer endpoint, signed with an HMAC SHA-512 signature. Server-to-endpoint HTTP, not WebSocket.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented anywhere in Moov's API reference or developer guides as of the review date.
