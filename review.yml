actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists on Moov's own API. Moov's public API is
    request/response REST (api.moov.io) and its asynchronous notifications are
    delivered by outbound webhooks to a customer-hosted HTTPS endpoint. Because
    there is no server-push streaming transport (WebSocket or SSE) on Moov's own
    API to model, no AsyncAPI document was created.
